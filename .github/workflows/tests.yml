name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q
      - name: validation sans GPU (reçu FAIL signé)
        run: python -m oracle.run --allow-cpu --mode quick --skip network --purpose calibration --out /tmp/r.json || true
      - run: python -m oracle.verify /tmp/r.json
